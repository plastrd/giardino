/* each new message gets a short entrance and is brought into view if it is off-screen */
function watchMsg(el){
  let last="";
  new MutationObserver(()=>{
    const txt=el.textContent.trim(); if(!txt||txt===last){last=txt;return} last=txt;
    el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
    setTimeout(()=>{const r=el.getBoundingClientRect();
      if(r.top<70||r.bottom>innerHeight){const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
        el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"})}},450);
  }).observe(el,{childList:true,characterData:true,subtree:true});
}

const FAQ_FX={box:document.querySelector("#faq .faq"),io:null,tab:null};
function faqArm(tab){
  const {box}=FAQ_FX;
  if(!box||!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(tab===FAQ_FX.tab) return; FAQ_FX.tab=tab;
  FAQ_FX.io?.disconnect();
  box.querySelectorAll("details").forEach((d,i)=>{d.style.setProperty("--i",i);d.open=false});
  box.classList.remove("faq-show");box.classList.add("faq-wait");
  FAQ_FX.io=new IntersectionObserver(es=>{
    if(!es.some(e=>e.isIntersecting)) return;
    box.classList.remove("faq-wait");void box.offsetWidth;box.classList.add("faq-show");FAQ_FX.io.disconnect();
  },{threshold:.15,rootMargin:"0px 0px -8% 0px"});
  requestAnimationFrame(()=>FAQ_FX.io.observe(box));
}
/* Home (buttons, tiles, Instagram), Rooms (intro, room cards, amenities band), Coffee & Bar photos/texts/enquiry form and the booking intro/form rise in from below the first time each one scrolls
   into view on this tab (same motion as the FAQ); on another visit to the tab they play again */
const RV={io:null,tab:null,sel:"#barGallery .ph, .events .event, .book-intro > *, #v-rooms .sec-head > *, #roomList .room, .amen > div, #v-availability .book > .panel, .enquiry, .tiles .tile, #v-home .hero .btn, .ig-sec .sec-head > *, #igGrid .ig-item, .ig-sec .wrap > .btn"};
function revealArm(tab){
  if(tab===RV.tab) return; RV.tab=tab;
  RV.io?.disconnect();
  const root=document.getElementById("v-"+tab);
  if(!root||!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const els=[...root.querySelectorAll(RV.sel)];
  els.forEach(el=>{el.classList.remove("rv-show");el.classList.add("rv-wait")});
  RV.io=new IntersectionObserver(es=>{
    const hits=es.filter(e=>e.isIntersecting).map(e=>e.target)
      .sort((a,b)=>{const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();return (ra.top-rb.top)||(ra.left-rb.left)});
    hits.forEach((el,i)=>{
      RV.io.unobserve(el);
      el.style.setProperty("--d",`${i*110}ms`);
      el.classList.remove("rv-wait");void el.offsetWidth;el.classList.add("rv-show");
    });
  },{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  requestAnimationFrame(()=>els.forEach(el=>RV.io.observe(el)));
}
/* content that arrives later (e.g. the Instagram photos) joins the same effect if its tab is open */
function revealAdd(els){
  if(!RV.io) return;
  const view=document.getElementById("v-"+RV.tab); if(!view) return;
  els.forEach(el=>{if(!view.contains(el))return;el.classList.add("rv-wait");RV.io.observe(el)});
}

}

/* ── date picker for arrival / departure (and the event date in Coffee & Bar) ──
   Departure opens on the arrival month, days before it are greyed out,
   and the arrival day is marked in soft green. */
const DP={id:null,y:0,m:0,cal:null};
const dpPad=n=>String(n).padStart(2,"0");
const dpISO=(y,m,d)=>`${y}-${dpPad(m+1)}-${dpPad(d)}`;
const dpAdd=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return dpISO(d.getFullYear(),d.getMonth(),d.getDate())};
const dpLoc=()=>lang==="en"?"en-GB":"el-GR";
const dpToday=()=>{const d=new Date();return dpISO(d.getFullYear(),d.getMonth(),d.getDate())};
const dpMax=()=>dpAdd(dpToday(),730);
const dpMin=id=>{const ci=$("#ci").value,tdy=dpToday();return id==="co"&&ci&&ci>=tdy?dpAdd(ci,1):tdy};
function dpRefresh(){
  ["ci","co","evDate"].forEach(id=>{const b=document.getElementById(id);if(!b)return;
    b.querySelector(".dp-txt").textContent=b.value?new Date(b.value+"T12:00").toLocaleDateString(dpLoc(),{day:"numeric",month:"short",year:"numeric"}):t("f.pick");
    b.classList.toggle("empty",!b.value)});
  if(DP.id) dpRender();
}
function dpOpen(id){
  if(DP.id===id){dpClose(true);return}
  dpClose(false);
  const b=$("#"+id),min=dpMin(id);
  let start=b.value||(id==="co"&&$("#ci").value)||min; if(start<min) start=min;
  DP.id=id;DP.y=+start.slice(0,4);DP.m=+start.slice(5,7)-1;
  const cal=document.createElement("div");
  cal.className="cal";cal.id="cal";cal.setAttribute("role","dialog");cal.setAttribute("aria-label",`${t("dp.cal")}: ${t(id==="ci"?"f.ci":"f.co")}`);
  b.parentNode.appendChild(cal);DP.cal=cal;
  b.setAttribute("aria-expanded","true");
  dpRender();
  /* keep the calendar inside the screen */
  const r=cal.getBoundingClientRect(),over=r.right-(document.documentElement.clientWidth-12);
  if(over>0) cal.style.left=`${-over}px`;
  (cal.querySelector(".cal-day.sel")||cal.querySelector(".cal-day:not(:disabled)"))?.focus({preventScroll:true});
  const cr=cal.getBoundingClientRect(); if(cr.bottom>innerHeight) window.scrollBy({top:cr.bottom-innerHeight+16,behavior:"smooth"});
}
function dpClose(focusBack){
  if(!DP.id) return; const b=$("#"+DP.id);
  DP.cal?.remove();DP.cal=null;b.setAttribute("aria-expanded","false");
  if(focusBack) b.focus({preventScroll:true});
  DP.id=null;
}
function dpRender(){
  const {id,y,m,cal}=DP; if(!cal) return;
  const loc=dpLoc(),min=dpMin(id),max=dpMax(),val=$("#"+id).value,ci=$("#ci").value,co=$("#co").value,tdy=dpToday();
  const title=new Date(y,m,1,12).toLocaleDateString(loc,{month:"long",year:"numeric"});
  const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const wd=[...Array(7)].map((_,i)=>`<span class="cal-wd" aria-hidden="true">${new Date(2024,0,1+i,12).toLocaleDateString(loc,{weekday:"narrow"})}</span>`).join("");
  let cells="";for(let i=0;i<first;i++)cells+=`<span></span>`;
  for(let d=1;d<=days;d++){
    const s=dpISO(y,m,d),cls=["cal-day"];
    if(s===tdy)cls.push("today");
    if(s===val)cls.push("sel");
    if(id==="co"&&s===ci)cls.push("arr");
    if(id==="co"&&ci&&co&&s>ci&&s<co)cls.push("range");
    const off=s<min||s>max;
    const label=new Date(s+"T12:00").toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    cells+=`<button type="button" class="${cls.join(" ")}" data-d="${s}" aria-label="${label}${s===ci&&id==="co"?" · "+t("dp.arr"):""}"${s===val?' aria-pressed="true"':""}${off?" disabled":""}>${d}</button>`;
  }
  const prevOff=dpISO(y,m,1)<=min.slice(0,8)+"01", nextOff=dpISO(y,m,1)>=max.slice(0,8)+"01";
  const legend=id==="co"&&ci?`<p class="cal-legend"><i aria-hidden="true"></i>${t("dp.arr")}: ${new Date(ci+"T12:00").toLocaleDateString(loc,{weekday:"short",day:"numeric",month:"short"})}</p>`:"";
  cal.innerHTML=`<div class="cal-head"><button type="button" class="cal-nav" data-nav="-1" aria-label="${t("dp.prev")}"${prevOff?" disabled":""}><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5l-7 7 7 7"/></svg></button><span class="cal-title" aria-live="polite">${title}</span><button type="button" class="cal-nav" data-nav="1" aria-label="${t("dp.next")}"${nextOff?" disabled":""}><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5l7 7-7 7"/></svg></button></div><div class="cal-grid">${wd}${cells}</div>${legend}`;
}
function dpMove(n){const d=new Date(DP.y,DP.m+n,1);DP.y=d.getFullYear();DP.m=d.getMonth();dpRender()}
function dpPick(s){
  const id=DP.id,b=$("#"+id);b.value=s;b.removeAttribute("aria-invalid");
  if(id==="ci"){const co=$("#co");if(co.value&&co.value<=s)co.value="";}
  dpRefresh();dpClose(true);
}
["ci","co","evDate"].forEach(id=>$("#"+id).addEventListener("click",()=>dpOpen(id)));
document.addEventListener("click",e=>{
  if(!DP.cal) return;
  const nav=e.target.closest(".cal-nav");if(nav&&DP.cal.contains(nav)){dpMove(+nav.dataset.nav);return}
  const day=e.target.closest(".cal-day");if(day&&DP.cal.contains(day)){if(!day.disabled)dpPick(day.dataset.d);return}
  if(!DP.cal.contains(e.target)&&!e.target.closest(".dpick")) dpClose(false);
});
/* soft preview of the stay while choosing departure */
document.addEventListener("pointerover",e=>{
  if(DP.id!=="co"||!DP.cal) return; const ci=$("#ci").value; const day=e.target.closest(".cal-day"); if(!ci||!day||!DP.cal.contains(day))return;
  const h=day.disabled?null:day.dataset.d;
  DP.cal.querySelectorAll(".cal-day").forEach(x=>x.classList.toggle("hov",!!h&&x.dataset.d>ci&&x.dataset.d<h));
});
document.addEventListener("keydown",e=>{
  if(!DP.cal) return;
  if(e.key==="Escape"){e.preventDefault();dpClose(true);return}
  const day=e.target.closest?.(".cal-day"); if(!day||!DP.cal.contains(day)) return;
  const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key]; if(!step) return;
  e.preventDefault();
  const s=dpAdd(day.dataset.d,step);
  if(s<dpMin(DP.id)||s>dpMax()) return;
  const y=+s.slice(0,4),m=+s.slice(5,7)-1; if(y!==DP.y||m!==DP.m){DP.y=y;DP.m=m;dpRender()}
  DP.cal.querySelector(`[data-d="${s}"]`)?.focus();
});

const money=(v,cur)=>new Intl.NumberFormat(lang==="en"?"en-GB":"el-GR",{style:"currency",currency:cur||"EUR"}).format(v);

/* κλήσεις στον Worker (ίδιο domain με το site, /api/...) */
const api=(path,body)=>fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(r=>r.json()).catch(()=>({ok:false,reason:"server_error"}));
function reasonMsg(r){
  switch(r.reason){
    case "not_available": return t("x.not_available");
    case "min_stay":      return t("x.min_stay")(r.minStay);
    case "no_rate":       return t("x.no_rate");
    case "too_long":      return t("x.too_long");
    case "max_stay":      return t("x.max_stay")(r.maxStay);
    case "no_arrival":    return t("x.no_arrival");
    case "no_departure":  return t("x.no_departure");
    case "past_date":     return t("e.past");
    case "invalid_dates": return t("e.min");
    case "invalid_guests":return booking.r?t("e.cap")(R(booking.r).name,booking.r.cap):t("x.server");
    case "invalid_name":  return t("e.name");
    case "invalid_email": return t("e.email");
    case "invalid_phone": return t("e.phone");
    case "captcha_failed":return t("x.captcha_failed");
    case "invalid_code":  return r.attemptsLeft?t("v.left")(r.attemptsLeft):t("v.bad");
    case "code_expired":  return t("v.expired");
    case "too_many_attempts": return t("v.locked");
    case "too_many_sends":return t("v.tooMany");
    case "too_soon":      return t("v.soon");
    case "email_unavailable":
    case "email_failed":  return t("v.mailDown");
    default:              return t("x.server");
  }
}
/* κουμπί σε κατάσταση "φορτώνει" */
function busy(btn,on,label){
  if(on){btn.disabled=true;btn.dataset.busy="1";btn.textContent=label}
  else{btn.disabled=false;delete btn.dataset.busy;btn.innerHTML=t(btn.dataset.i18n)}
}

/* Turnstile (captcha) */
let tsId=null,tsToken="",tsTries=0;
function captcha(){
  tsToken="";
  if(!window.turnstile){if(tsTries++<50)setTimeout(captcha,200);return}
  if(tsId!==null){turnstile.reset(tsId);return}
  tsId=turnstile.render("#captcha",{sitekey:TURNSTILE_SITEKEY,language:lang,
    callback:v=>{tsToken=v},"expired-callback":()=>{tsToken=""},"error-callback":()=>{tsToken=""}});
}

/* ===== ΚΡΑΤΗΣΗ ΣΕ 5 ΒΗΜΑΤΑ =====
   1 Ημερομηνίες · 2 Στοιχεία · 3 Τιμή · 4 Επαλήθευση email · 5 Ολοκλήρωση
   Πίσω: με το κουμπί «Πίσω» ή πατώντας προηγούμενο βήμα (έως και το βήμα 4). Μπροστά: μόνο με τα κουμπιά. */
const BREAKFAST_PP=9;   /* € ανά άτομο ανά νύχτα — ΙΔΙΟ με το BREAKFAST_PP στον Worker (εκεί υπολογίζεται η τελική τιμή) */
const AVAIL_REASONS=["not_available","min_stay","max_stay","no_rate","no_arrival","no_departure"];

/* κωδικοί τηλεφώνου: πρώτα Ελλάδα και Κύπρος, οι υπόλοιπες αλφαβητικά (τα ονόματα βγαίνουν στη γλώσσα του site) */
const PHONE_CODES=[["GR","30"],["CY","357"],["AL","355"],["AM","374"],["AT","43"],["AU","61"],["BE","32"],["BG","359"],["CA","1"],["CH","41"],
  ["CZ","420"],["DE","49"],["DK","45"],["EE","372"],["EG","20"],["ES","34"],["FI","358"],["FR","33"],["GB","44"],["GE","995"],["HR","385"],
  ["HU","36"],["IE","353"],["IL","972"],["IT","39"],["LB","961"],["LT","370"],["LU","352"],["LV","371"],["MK","389"],["MT","356"],["NL","31"],
  ["NO","47"],["PL","48"],["PT","351"],["RO","40"],["RS","381"],["RU","7"],["SE","46"],["SI","386"],["SK","421"],["TR","90"],["UA","380"],["US","1"]];
/* σωστό πλήθος ψηφίων ανά χώρα (εθνικός αριθμός, χωρίς κωδικό χώρας και χωρίς το αρχικό 0) */
const PHONE_LEN={GR:[10],CY:[8],AL:[8,9],AM:[8],AT:[7,13],AU:[9],BE:[8,9],BG:[8,9],CA:[10],CH:[9],CZ:[9],DE:[6,12],DK:[8],EE:[7,8],EG:[9,10],
  ES:[9],FI:[6,11],FR:[9],GB:[9,10],GE:[9],HR:[8,9],HU:[8,9],IE:[7,9],IL:[8,9],IT:[6,11],LB:[7,8],LT:[8],LU:[6,11],LV:[8],MK:[8],MT:[8],
  NL:[9],NO:[8],PL:[9],PT:[9],RO:[9],RS:[8,9],RU:[10],SE:[7,9],SI:[8],SK:[9],TR:[10],UA:[9],US:[10]};
function regionName(c){try{return new Intl.DisplayNames([lang],{type:"region"}).of(c)}catch(_){return c}}
function renderPhoneCodes(){
  const others=PHONE_CODES.slice(2).sort((a,b)=>regionName(a[0]).localeCompare(regionName(b[0]),lang));
  const html=[...PHONE_CODES.slice(0,2),...others].map(([c,d])=>`<option value="${c}">+${d} · ${esc(regionName(c))}</option>`).join("");
  ["#phCode","#evPhCode"].forEach(id=>{const sel=$(id);if(!sel)return;const v=sel.value||"GR";sel.innerHTML=html;sel.value=v;ccShow(sel)});
}
/* το κλειστό πεδίο δείχνει μόνο «+30 GR»· η λίστα έχει τα πλήρη ονόματα χωρών */
function ccShow(sel){const d=(PHONE_CODES.find(x=>x[0]===sel.value)||PHONE_CODES[0]);sel.previousElementSibling.textContent=`+${d[1]} ${d[0]}`}
["#phCode","#evPhCode"].forEach(id=>$(id).addEventListener("change",e=>ccShow(e.target)));
const dial=(sel="#phCode")=>(PHONE_CODES.find(x=>x[0]===$(sel).value)||PHONE_CODES[0])[1];
/* αριθμός + κωδικός χώρας → {e164:"+306912345678", disp:"+30 6912345678"} ή null αν δεν ταιριάζει με τη χώρα */
function fullPhone(codeSel="#phCode",inputSel="#ph"){
  const raw=$(inputSel).value.trim(),code=dial(codeSel),country=$(codeSel).value||"GR";
  let d=raw.replace(/\D/g,"");
  if(raw.startsWith("+")&&d.startsWith(code)) d=d.slice(code.length);       /* έγραψε και τον κωδικό με + */
  else if(d.startsWith("00"+code)) d=d.slice(2+code.length);                /* ή με 00 */
  if(code!=="30"&&code!=="39"&&d.startsWith("0")) d=d.slice(1);              /* εθνικό πρόθεμα 0 (π.χ. UK 07…) */
  const [min,max=min]=PHONE_LEN[country]||[6,13];
  const ok=d.length>=min&&d.length<=max;
  return ok?{e164:`+${code}${d}`,disp:`+${code} ${d}`}:null;
}
/* μήνυμα λάθους για τη χώρα που επιλέχθηκε */
function phoneErr(codeSel="#phCode"){
  const c=$(codeSel).value||"GR"; if(c==="GR") return t("e.phoneGR");
  const L=PHONE_LEN[c]; if(!L) return t("e.phone");
  return t("e.phoneLen")(regionName(c),L.length>1?`${L[0]}–${L[1]}`:L[0]);
}

/* βήματα */
const STEP_BOX={1:"#f1",2:"#s2",3:"#s3",4:"#s4",5:"#done"};
const STEP_FOCUS={1:"#ci",2:"#fn",3:"#s3 .step-title",4:"#s4 .step-title",5:".done-title"};
let step=1;
/* μετακίνηση στην κάρτα της κράτησης (όχι στις συχνές ερωτήσεις) */
function toPanel(focusEl){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#v-availability .panel").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  if(focusEl) focusEl.focus({preventScroll:true});
}
function goStep(n,scroll=true){
  if(step===4||n===4) resetVerify();      /* μπαίνει ή φεύγει από το βήμα 4 → χρειάζεται νέος κωδικός, άδειο πεδίο */
  step=n;
  Object.entries(STEP_BOX).forEach(([k,s])=>{$(s).hidden=+k!==n});
  document.querySelectorAll("#steps [data-step]").forEach(b=>{
    const k=+b.dataset.step;
    b.className="step"+(k===n?" on":k<n?" done":"");
    b.disabled=!(k<n&&n<5);                /* μόνο προς τα πίσω, και όχι μετά την ολοκλήρωση */
    if(k===n)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");
  });
  ["#e1","#e2","#e3","#e4"].forEach(s=>$(s).textContent="");
  if(n===4){renderVerify();captcha()}
  if(scroll) toPanel($(STEP_FOCUS[n]));
}
$("#steps").addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(b&&!b.disabled)goStep(+b.dataset.step)});
document.addEventListener("click",e=>{if(e.target.closest("[data-back]")&&step>1&&step<5)goStep(step-1)});

/* απόδοση περιεχομένου */
function renderAvail(){
  const {ci,co,n,g,r,room,cur}=booking;
  $("#availBox").innerHTML=`<span class="eyebrow">${t("a.yes")}</span><b>${R(r).name}</b><span>${fmt(ci)} → ${fmt(co)} · ${n} ${t("a.nights")(n)} · ${g} ${t("a.guests")(g)}</span><span class="price">${t("a.room")}: <strong>${money(room,cur)}</strong></span>`;
}
function renderBf(){
  const {g,n,cur}=booking;
  $("#bfLive").textContent=$("#bf").checked&&g?t("f.bfLive")(g,n,money(BREAKFAST_PP,cur),money(g*n*BREAKFAST_PP,cur)):"";
}
$("#bf").addEventListener("change",renderBf);
const depNote=b=>`<b>${t("p.depH")}</b><p>${t("p.dep")(money(b.deposit,b.cur))}</p>`;
function renderPrice(){
  const b=booking,rows=[[t("p.room")(b.n),money(b.room,b.cur)]];
  if(b.bf) rows.push([t("p.bf")(b.g,b.n,money(BREAKFAST_PP,b.cur)),money(b.breakfast,b.cur)]);
  $("#priceBox").innerHTML=`<p class="eyebrow">${R(b.r).name}</p><p class="stay">${fmt(b.ci)} → ${fmt(b.co)} · ${b.g} ${t("a.guests")(b.g)}</p>
    <dl class="price-rows">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}<dt class="tot">${t("p.total")}</dt><dd class="tot">${money(b.total,b.cur)}</dd></dl>
    ${b.deposit?`<div class="note">${depNote(b)}</div>`:""}`;
}
function renderDone(){
  const b=booking;
  const rows=[[t("s.room"),R(b.r).name],[t("s.ci"),fmt(b.ci)],[t("s.co"),fmt(b.co)],[t("s.nights"),b.n],[t("s.guests"),b.g],
    [t("s.bf"),b.bf?t("s.yes"):t("s.no")],[t("s.total"),money(b.total,b.cur)]];
  if(b.deposit) rows.push([t("s.deposit"),money(b.deposit,b.cur)]);
  rows.push(["Email",b.em],[t("s.phone"),b.phDisp]);
  $("#dSum").innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  $("#dDep").hidden=!b.deposit; $("#dDep").innerHTML=b.deposit?depNote(b):"";
}

/* Βήμα 1 → 2: διαθεσιμότητα + τιμή δωματίου από το Hosthub */
$("#f1").addEventListener("submit",async e=>{
  e.preventDefault();const ci=$("#ci").value,co=$("#co").value,g=+$("#guests").value,r=ROOMS.find(x=>x.id===$("#room").value);
  clearErr("#e1");
  if(!ci) return fail("#e1",t("e.dates"),"#ci");
  if(!co) return fail("#e1",t("e.dates"),"#co");
  if(ci<iso(today)) return fail("#e1",t("e.past"),"#ci");
  const n=Math.round((new Date(co)-new Date(ci))/864e5);
  if(n<1) return fail("#e1",t("e.min"),"#co");
  if(g>r.cap) return fail("#e1",t("e.cap")(R(r).name,r.cap),"#guests");

  const btn=$("#f1 [type=submit]");
  busy(btn,true,t("a.checking"));
  const q=await api("/api/quote",{slug:r.id,checkIn:ci,checkOut:co,adults:g});
  busy(btn,false);
  booking={ci,co,n,g,r};
  if(!q.ok) return $("#e1").textContent=reasonMsg(q);

  Object.assign(booking,{n:q.nights,room:q.room,cur:q.currency});
  renderAvail(); renderBf();
  goStep(2);
});

/* Βήμα 2 → 3: στοιχεία + πρωινό, τελική τιμή από τον Worker */
$("#f2").addEventListener("submit",async e=>{
  e.preventDefault();clearErr("#e2");
  const fn=$("#fn").value.trim(),ln=$("#ln").value.trim(),em=$("#em").value.trim(),p=fullPhone(),bf=$("#bf").checked;
  if(!fn) return fail("#e2",t("e.name"),"#fn");
  if(!ln) return fail("#e2",t("e.name"),"#ln");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return fail("#e2",t("e.email"),"#em");
  if(!p) return fail("#e2",phoneErr("#phCode"),"#ph");
  if(!$("#ok").checked) return fail("#e2",t("e.ok"),"#ok");

  const btn=$("#f2 [type=submit]");
  busy(btn,true,t("a.checking"));
  const q=await api("/api/quote",{slug:booking.r.id,checkIn:booking.ci,checkOut:booking.co,adults:booking.g,breakfast:bf});
  busy(btn,false);
  if(!q.ok){
    if(AVAIL_REASONS.includes(q.reason)){goStep(1);$("#e1").textContent=reasonMsg(q);return}
    return $("#e2").textContent=reasonMsg(q);
  }
  Object.assign(booking,{fn,ln,em,ph:p.e164,phDisp:p.disp,bf,ctry:$("#ctry").value.trim(),notes:$("#notes").value.trim(),
    n:q.nights,room:q.room,breakfast:q.breakfast,total:q.total,deposit:q.deposit,cur:q.currency});
  renderPrice();
  goStep(3);
});

/* Βήμα 3 → 4 */
$("#toVerify").onclick=()=>goStep(4);

/* Βήμα 4: επαλήθευση email με 8ψήφιο κωδικό */
const V={sent:false,ok:false,until:0,timer:null};
function setVStatus(cls,msg){const s=$("#vStatus");s.className="v-status"+(cls?" "+cls:"");s.textContent=msg}
function resetVerify(){
  /* ο κωδικός αυτής της επίσκεψης στο βήμα ακυρώνεται και στον server → ισχύει μόνο ο επόμενος που θα σταλεί */
  if(V.sent&&booking.em) api("/api/verify/reset",{email:booking.em});
  clearInterval(V.timer);Object.assign(V,{sent:false,ok:false,until:0,timer:null});
  const c=$("#vCode");c.value="";c.disabled=true;c.classList.remove("good","bad");c.removeAttribute("aria-invalid");
  $("#vCheck").disabled=true;$("#finish").disabled=true;
  setVStatus("","");renderSend();
}
function renderVerify(){$("#vText").innerHTML=t("v.text")(esc(booking.em||""));renderSend()}
function renderSend(){
  const b=$("#vSend"),left=Math.ceil((V.until-Date.now())/1000);
  if(V.ok){b.disabled=true;b.textContent=t("v.resend");return}
  if(!V.sent){b.disabled=false;b.textContent=t("v.send");return}
  if(left>0){b.disabled=true;b.textContent=t("v.wait")(`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`)}
  else{b.disabled=false;b.textContent=t("v.resend");clearInterval(V.timer);V.timer=null}
}
$("#vSend").onclick=async()=>{
  const b=$("#vSend");b.disabled=true;b.textContent=t("f.sending");
  const r=await api("/api/verify/send",{email:booking.em,lang});
  if(!r.ok){
    if(r.reason==="too_many_attempts") return lockOut();
    if(r.reason==="too_soon"&&r.retryIn){                                  /* μόλις στάλθηκε: περιμένει ως το 1 λεπτό */
      V.until=Date.now()+r.retryIn*1000;V.sent=true;
      clearInterval(V.timer);V.timer=setInterval(renderSend,1000);
    }
    renderSend();setVStatus("bad",reasonMsg(r));return;
  }
  V.sent=true;V.ok=false;V.until=Date.now()+60000;                       /* επαναποστολή μετά από 1 λεπτό */
  clearInterval(V.timer);V.timer=setInterval(renderSend,1000);renderSend();
  const c=$("#vCode");c.disabled=false;c.value="";c.classList.remove("good","bad");c.removeAttribute("aria-invalid");
  $("#vCheck").disabled=false;
  setVStatus("",t("v.sent")(booking.em));c.focus();
};
function markBad(msg){const c=$("#vCode");c.classList.remove("good");c.classList.add("bad");c.setAttribute("aria-invalid","true");setVStatus("bad",msg);c.focus()}
async function checkCode(){
  if(!V.sent||V.ok) return;
  const c=$("#vCode"),code=c.value.replace(/\D/g,"");
  if(code.length!==8) return markBad(t("v.len"));
  const btn=$("#vCheck");
  busy(btn,true,t("a.checking"));
  const r=await api("/api/verify/check",{email:booking.em,code});
  busy(btn,false);
  if(!r.ok){
    if(r.reason==="too_many_attempts") return lockOut();
    return markBad(reasonMsg(r));
  }
  V.ok=true;booking.code=code;clearInterval(V.timer);V.timer=null;
  c.classList.remove("bad");c.classList.add("good");c.removeAttribute("aria-invalid");c.disabled=true;btn.disabled=true;
  renderSend();setVStatus("good",t("v.ok"));
  $("#finish").disabled=false;
}
$("#vCheck").onclick=checkCode;
/* 5 λάθος κωδικοί: μήνυμα και επιστροφή στην αρχή της κράτησης, με το email σημειωμένο για διόρθωση */
function lockOut(){
  goStep(1);
  fail("#e1",t("v.locked"));
  $("#em").setAttribute("aria-invalid","true");

const attr=s=>esc(s).replace(/"/g,"&quot;");
function loadIG(){
  const g=$("#igGrid"); if(!IG_FEED) return;
  fetch(IG_FEED).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
    const posts=(Array.isArray(d)?d:(d.posts||[])).slice(0,IG_COUNT);
    g.innerHTML=posts.map(p=>{
      const sz=p.sizes||{};
      const src=(sz.medium&&sz.medium.mediaUrl)||(sz.small&&sz.small.mediaUrl)||(p.mediaType==="VIDEO"?p.thumbnailUrl:p.mediaUrl);
      if(!src) return "";
      const cap=(p.prunedCaption||p.caption||"").slice(0,120);
      return `<a class="ig-item" href="${attr(p.permalink||"https://www.instagram.com/giardino.drama/")}" target="_blank" rel="noopener"><img src="${attr(src)}" alt="${attr(cap||t("ig.post"))}" loading="lazy"></a>`;
    }).join("");
    revealAdd([...g.querySelectorAll(".ig-item")]);
  }).catch(()=>{g.innerHTML=""});
}

/* ===== ΩΡΑΡΙΟ ΜΠΑΡ (ώρα Ελλάδας) =====
   Ο κύκλος στη γραμμή δείχνει την τωρινή ώρα ανάμεσα σε άνοιγμα και κλείσιμο. */
const BAR_HOURS={OPEN:9,CLOSE:25,SWITCH:18};
function dnTick(){
  const dot=$("#dnDot"); if(!dot) return;
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Athens",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const h=+parts.find(x=>x.type==="hour").value, mi=+parts.find(x=>x.type==="minute").value;
  const o=BAR_HOURS.OPEN*60,c=BAR_HOURS.CLOSE*60,sw=BAR_HOURS.SWITCH*60;
  let m=h*60+mi; if(m<o&&m+1440<c) m+=1440;          /* μετά τα μεσάνυχτα */
  const open=m>=o&&m<c, p=open?(m-o)/(c-o):0;
  const phase=!open?"closed":m<sw?"day":"night";
  const box=$(".daynight"); box.dataset.phase=phase; box.style.setProperty("--p",p.toFixed(4));
  $("#dnNow").textContent=t(phase==="day"?"dn.nowDay":phase==="night"?"dn.nowNight":"dn.closed");
}
setInterval(dnTick,60000);

/* intro screen: soft green cover with the pulsing mark; lifts up on the first move/touch/scroll/key or after a few seconds */
(function(){
  const el=$("#intro"),root=document.documentElement;
  if(!el||!root.classList.contains("intro-on")){el?.remove();return}
  try{sessionStorage.setItem("gi-intro","1")}catch(_){}
  const t0=performance.now(),EVENTS=["pointermove","pointerdown","touchstart","wheel","keydown","scroll"];
  let gone=false;
  function leave(){
    if(gone) return;
    const wait=Math.max(0,700-(performance.now()-t0));   /* let it be seen for a moment */
    if(wait){setTimeout(leave,wait);return}
    gone=true;EVENTS.forEach(ev=>removeEventListener(ev,leave,true));
    el.classList.add("out");
    /* the page's rise-in effects played under the cover: replay them as it lifts */
    const v=document.querySelector(".view:not([hidden])")?.id.replace("v-","");
    if(v){RV.tab=null;FAQ_FX.tab=null;revealArm(v);faqArm(v)}
    const done=()=>{el.remove();root.classList.remove("intro-on","intro-lock")};
    el.addEventListener("transitionend",done,{once:true});setTimeout(done,1400);
  }
  root.classList.add("intro-lock");
  EVENTS.forEach(ev=>addEventListener(ev,leave,{capture:true,passive:true}));
  setTimeout(leave,3200);
})();
