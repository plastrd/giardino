<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Giardino · Κωδικός</title>
<link rel="icon" type="image/png" href="img/mark.png">
<style>
  /* Σελίδα αντιγραφής του κωδικού επαλήθευσης — ανοίγει από το κουμπί «Αντιγραφή κωδικού» του email.
     Ο κωδικός είναι μετά το # στη διεύθυνση, άρα δεν φτάνει ποτέ στον server. */
  :root{--bg:#F4F2EC;--card:#fff;--ink:#2F3A2B;--muted:#686D5B;--leaf:#585B48;--sage:#8A916F;--soft:#EEEFE6;--cream:#E9E4D7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;padding:20px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid #E4E0D4;border-radius:16px;overflow:hidden;text-align:center}
  .top{background:var(--cream);padding:22px;border-bottom:3px solid var(--leaf)}
  .top img{width:150px;max-width:60%;height:auto;display:block;margin:0 auto}
  .body{padding:28px 24px 30px}
  .label{margin:0 0 12px;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:var(--sage)}
  .code{display:inline-block;padding:12px 22px;border:1px solid var(--sage);border-radius:10px;background:var(--soft);
    font-family:"GFS Didot",Didot,Georgia,serif;font-size:34px;letter-spacing:6px;user-select:all;-webkit-user-select:all}
  button{margin-top:20px;font:inherit;font-weight:600;font-size:16px;border:0;border-radius:999px;padding:13px 26px;
    background:var(--leaf);color:#fff;cursor:pointer;min-width:220px}
  button.done{background:var(--sage)}
  .hint{margin:16px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <div class="top"><img src="img/wordmark.png" alt="Giardino"></div>
  <div class="body">
    <p class="label" id="label">Ο κωδικός σας</p>
    <div class="code" id="code">—</div><br>
    <button type="button" id="copy">Αντιγραφή κωδικού</button>
    <p class="hint" id="hint">Επιστρέψτε στη σελίδα της κράτησης και επικολλήστε τον κωδικό.</p>
  </div>
</main>
<script>
  const q=new URLSearchParams(location.hash.slice(1));
  const code=(q.get("c")||"").replace(/\D/g,"").slice(0,8);
  const en=q.get("l")==="en";
  const T=en?{label:"Your code",copy:"Copy code",done:"Copied ✓",hint:"Go back to the booking page and paste the code.",title:"Giardino · Code"}
            :{label:"Ο κωδικός σας",copy:"Αντιγραφή κωδικού",done:"Αντιγράφηκε ✓",hint:"Επιστρέψτε στη σελίδα της κράτησης και επικολλήστε τον κωδικό.",title:"Giardino · Κωδικός"};
  document.documentElement.lang=en?"en":"el"; document.title=T.title;
  const $=id=>document.getElementById(id);
  $("label").textContent=T.label; $("hint").textContent=T.hint; $("code").textContent=code||"—";
  const btn=$("copy"); btn.textContent=T.copy; btn.disabled=!code;
  function done(){btn.textContent=T.done;btn.classList.add("done")}
  function fallback(){const r=document.createRange();r.selectNodeContents($("code"));const s=getSelection();s.removeAllRanges();s.addRange(r);try{if(document.execCommand("copy"))done()}catch(_){}}
  btn.onclick=()=>{ if(navigator.clipboard?.writeText) navigator.clipboard.writeText(code).then(done,fallback); else fallback(); };
  /* καθαρίζει τον κωδικό από τη διεύθυνση/ιστορικό */
  try{history.replaceState(null,"",location.pathname)}catch(_){}
</script>
</body>
</html>
