<body>
<header>

    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="links" data-i18n="nav.menu"></button>
    <nav class="links" id="links" data-i18n-attr="aria-label:nav.aria">
      <a href="#home" data-go="home" data-i18n="nav.home"></a>
      <a href="#rooms" data-go="rooms" data-i18n="nav.rooms"></a>
      <a href="#availability" data-go="availability" data-i18n="nav.avail"></a>
      <a href="#bar" data-go="bar" data-i18n="nav.bar"></a>

<main>

    <div class="hero">

        <h1 class="sr-only">Giardino · Espresso Wine Bar &amp; High Living Suites</h1>

          <a class="btn btn-primary" href="#availability" data-go="availability" data-i18n="hero.cta1"></a>
          <a class="btn btn-ghost" href="#rooms" data-go="rooms" data-i18n="hero.cta2"></a>
        </div>
      </div>
    </div>
  </div>
  </div>
  <div class="wrap">
    <div class="facts">
      <div><b data-i18n="facts.1b"></b><span data-i18n="facts.1s"></span></div>

      <div><b data-i18n="facts.4b"></b><span data-i18n="facts.4s"></span></div>
    </div>
  </div>
  <section>
    <div class="wrap">
      <div class="sec-head"><p class="eyebrow" data-i18n="home.eyebrow"></p></div>
      <div class="tiles">

        <a class="tile" href="#tourism" data-go="tourism"><h3 data-i18n="tile.3h"></h3><p data-i18n="tile.3p"></p><span class="go" data-i18n="tile.3go"></span></a>
      </div>
    </div>
  </section>
</div>

<!-- ROOMS -->
<div class="view" id="v-rooms" hidden>
  <section><div class="wrap">
    <div class="sec-head"><p class="eyebrow" data-i18n="rooms.eyebrow"></p><h2 data-i18n="rooms.h2"></h2><p class="lede" data-i18n="rooms.lede"></p></div>
    <div class="rooms" id="roomList"></div>
    <div class="amen">
      <div><b data-i18n="amen.1b"></b><span data-i18n="amen.1s"></span></div>
      <div><b data-i18n="amen.2b"></b><span data-i18n="amen.2s"></span></div>
      <div><b data-i18n="amen.3b"></b><span data-i18n="amen.3s"></span></div>
      <div><b data-i18n="amen.4b"></b><span data-i18n="amen.4s"></span></div>
    </div>
  </div></section>
</div>

<!-- AVAILABILITY -->
<div class="view" id="v-availability" hidden>
  <section><div class="wrap book">
    <div>
      <div class="sec-head"><p class="eyebrow" data-i18n="avail.eyebrow"></p><h2 data-i18n="avail.h2"></h2><p class="lede" data-i18n="avail.lede"></p></div>
    </div>

    <div class="panel">
      <div class="steps"><span class="step on" id="st1" data-i18n="step.1"></span><span class="step" id="st2" data-i18n="step.2"></span><span class="step" id="st3" data-i18n="step.3"></span></div>

      <form id="f1" novalidate>
        <div class="grid2">
          <div class="field"><label for="ci" data-i18n="f.ci"></label><input type="date" id="ci" required></div>
          <div class="field"><label for="co" data-i18n="f.co"></label><input type="date" id="co" required></div>
          <div class="field"><label for="guests" data-i18n="f.guests"></label>
            <select id="guests"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
          <div class="field"><label for="room" data-i18n="f.room"></label><select id="room"></select></div>
        </div>
        <p class="err" id="e1" role="alert"></p>
        <button class="btn btn-primary" type="submit" data-i18n="f.check"></button>
      </form>

      <div id="avail" hidden>
        <div class="result" id="availBox"></div>
        <form id="f2" class="details-form" novalidate>
          <div class="grid2">
            <div class="field"><label for="fn" data-i18n="f.fn"></label><input id="fn" autocomplete="given-name" required></div>
            <div class="field"><label for="ln" data-i18n="f.ln"></label><input id="ln" autocomplete="family-name" required></div>
            <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>
            <div class="field"><label for="ph" data-i18n="f.ph"></label><input id="ph" type="tel" autocomplete="tel" required></div>
            <div class="field"><label for="ctry" data-i18n="f.ctry"></label><input id="ctry" autocomplete="country-name"></div>
            <div class="field"><label for="eta" data-i18n="f.eta"></label>
              <select id="eta"><option value="14:00–16:00">14:00–16:00</option><option value="16:00–18:00" selected>16:00–18:00</option><option value="18:00–20:00">18:00–20:00</option><option value="late" data-i18n="f.eta4"></option></select></div>
            <div class="field full"><label for="notes" data-i18n="f.notes"></label><textarea id="notes" data-i18n-attr="placeholder:f.notesPh"></textarea></div>
            <label class="check field full" for="ok"><input type="checkbox" id="ok"> <span data-i18n="f.ok"></span></label>
          </div>
          <p class="err" id="e2" role="alert"></p>
          <div class="btn-row">
            <button class="btn btn-primary" type="submit" data-i18n="f.send"></button>
            <button class="btn btn-ghost" type="button" id="back" data-i18n="f.back"></button>
          </div>
        </form>
      </div>

      <div id="done" hidden>
        <p class="eyebrow" data-i18n="done.eyebrow"></p>
        <h3 class="done-title"><span data-i18n="done.thanks"></span> <span id="dName"></span>.</h3>
        <dl class="summary" id="dSum"></dl>
        <p class="done-note"><span data-i18n="done.note"></span> <span class="ref" id="dRef"></span></p>
        <button class="btn btn-ghost" type="button" id="again" class="again-btn" data-i18n="done.again"></button>
      </div>
    </div>
  </div></section>
</div>

<!-- BAR -->
<div class="view" id="v-bar" hidden>
  <section><div class="wrap">
    <div class="bar-hero">
      <div><p class="eyebrow" data-i18n="bar.eyebrow"></p></div>
      <div class="hours">
        <span data-i18n="bar.h1"></span><span data-i18n="bar.h1v"></span>
        <span>Wine bar</span><span data-i18n="bar.h2v"></span>
        <span data-i18n="bar.h3"></span><span data-i18n="bar.h3v"></span>
      </div>
    </div>
    <div class="gallery" id="barGallery" data-i18n-attr="aria-label:bar.galleryAria"></div>
    <div class="events">
      <div class="event"><p class="eyebrow" data-i18n="ev.1e"></p><h3 data-i18n="ev.1h"></h3><p data-i18n="ev.1p"></p></div>
      <div class="event"><p class="eyebrow">Live events</p><h3 data-i18n="ev.2h"></h3><p data-i18n="ev.2p"></p></div>
      <div class="event"><p class="eyebrow">Private events</p><h3 data-i18n="ev.3h"></h3><p data-i18n="ev.3p"></p></div>
    </div>
    <div class="panel enquiry">
      <div class="sec-head"><p class="eyebrow" data-i18n="enq.eyebrow"></p><h3 data-i18n="enq.h3"></h3></div>
      <form id="fe" novalidate>
        <div class="grid2">
          <div class="field"><label for="evType" data-i18n="enq.type"></label><select id="evType"><option data-i18n="enq.o1"></option><option>Private event</option><option data-i18n="enq.o3"></option><option data-i18n="enq.o4"></option></select></div>
          <div class="field"><label for="evDate" data-i18n="enq.date"></label><input type="date" id="evDate"></div>
          <div class="field"><label for="evPeople" data-i18n="enq.people"></label><input type="number" id="evPeople" min="1" value="40"></div>
          <div class="field"><label for="evContact" data-i18n="enq.contact"></label><input id="evContact" required></div>
        </div>
        <p class="err" id="eE" role="alert"></p>
        <button class="btn btn-primary" type="submit" data-i18n="enq.send"></button>
      </form>
    </div>
  </div></section>
</div>

<!-- TOURISM -->
<div class="view" id="v-tourism" hidden>
  <section><div class="wrap">
    <div class="sec-head"><p class="eyebrow" data-i18n="tour.eyebrow"></p><h2 data-i18n="tour.h2"></h2></div>
    <div class="soon"><img src="img/mark.png" alt=""><p data-i18n="tour.soon"></p></div>
  </div></section>
</div>

<!-- FAQ (all views) -->
<section id="faq"><div class="wrap faq-wrap">
  <div class="sec-head"><p class="eyebrow">FAQ</p><h2 data-i18n="faq.h2"></h2><p class="lede" data-i18n="faq.lede"></p></div>
  <div class="faq">
    <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
    <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
    <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
    <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
    <details><summary data-i18n="faq.q5"></summary><p data-i18n="faq.a5"></p></details>
    <details><summary data-i18n="faq.q6"></summary><p data-i18n="faq.a6"></p></details>
    <details><summary data-i18n="faq.q7"></summary><p data-i18n="faq.a7"></p></details>
  </div>
</div></section>
</main>

<!-- room photo lightbox -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lbTitle">

</div>

/* ===== ΦΩΤΟΓΡΑΦΙΕΣ =====
   Βάλτε τις φωτογραφίες στον φάκελο και αλλάξτε ΜΟΝΟ τον αριθμό.
   Ονόματα αρχείων: one-1.jpg, one-2.jpg, … (αριθμημένα με τη σειρά, χωρίς κενά) */
const PHOTO_COUNT={
  one_apart:8,   /* img/one_apart/one-1.jpg … */
  two_apart:12,   /* img/two_apart/apt-1.jpg … */
  bar: 16         /* img/bar/bar-1.jpg … */
};
const pics=(dir,name,n,ext=".jpg")=>Array.from({length:n},(_,i)=>`img/${dir}/${name}-${i+1}${ext}`);

/* Rooms: texts per language */
const ROOMS=[
  {id:"s1",cap:2,photos:pics("one_apart","one",PHOTO_COUNT.one_apart),
   el:{name:"Διαμέρισμα ενός υπνοδωματίου",size:"Διπλό κρεβάτι",tags:["Προϊόντα COCO-MAT","Καφετιέρα","Smart TV","Κλιματισμός"],desc:"Ζεστό διαμέρισμα για ζευγάρια, με ξύλινα πατώματα, μαρμάρινο μπάνιο με ντουζιέρα και φυσικά προϊόντα COCO-MAT."},
   en:{name:"One-Bedroom Apartment",size:"Double bed",tags:["COCO-MAT products","Coffee maker","Smart TV","Air conditioning"],desc:"A warm apartment for couples, with wooden floors, a marble bathroom with walk-in shower and natural COCO-MAT products."}},
  {id:"s2",cap:4,photos:pics("two_apart","apt",PHOTO_COUNT.two_apart),
   el:{name:"Διαμέρισμα δύο υπνοδωματίων",size:"2 υπνοδωμάτια με διπλά κρεβάτια",tags:["2 υπνοδωμάτια","Καθιστικό","Προϊόντα COCO-MAT","Καφετιέρα","Smart TV","Κλιματισμός"],desc:"Δύο ξεχωριστά υπνοδωμάτια γύρω από ένα φωτεινό καθιστικό, με ξύλινα πατώματα και γωνιά για καφέ. Ιδανικό για οικογένειες ή δύο ζευγάρια."},
   en:{name:"Two-Bedroom Apartment",size:"2 bedrooms with double beds",tags:["2 bedrooms","Living room","COCO-MAT products","Coffee maker","Smart TV","Air conditioning"],desc:"Two separate bedrooms around a bright living room, with wooden floors and a coffee corner. Ideal for families or two couples."}}
];
const BAR_PHOTOS=pics("bar","bar",PHOTO_COUNT.bar);
const $=s=>document.querySelector(s);

/* language */
let lang="el";
try{const s=localStorage.getItem("lang");if(s in STR)lang=s}catch(_){}
try{const q=new URLSearchParams(location.search).get("lang");if(q in STR)lang=q}catch(_){}
const t=k=>(STR[lang][k]!==undefined?STR[lang][k]:STR.el[k]);
const R=r=>r[lang]||r.el;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function setLang(l){
  const prev=lang; lang=l in STR?l:"el";
  try{localStorage.setItem("lang",lang)}catch(_){}
  document.documentElement.lang=lang;
  document.title=t("meta.title");
  document.querySelector('meta[name="description"]').setAttribute("content",t("meta.desc"));
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-attr]").forEach(el=>{
    el.dataset.i18nAttr.split(";").forEach(p=>{const [a,k]=p.split(":");el.setAttribute(a.trim(),t(k.trim()))});
  });
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  /* country field: swap only if it still holds the default value */
  const c=$("#ctry"); if(!c.value||c.value===STR[prev]["f.ctryDefault"]) c.value=t("f.ctryDefault");
  renderRooms(); renderBar();
  if(!$("#avail").hidden) renderAvail();
  if(!$("#done").hidden) renderDone();
  ["#e1","#e2","#eE"].forEach(s=>$(s).textContent="");
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

/* views */
const VIEWS=["home","rooms","availability","bar","tourism"];
function show(v,scroll=true){
  if(!VIEWS.includes(v)) v="home";
  VIEWS.forEach(x=>$("#v-"+x).hidden=x!==v);
  document.querySelectorAll(".links a").forEach(a=>{if(a.dataset.go===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("#links").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");
  if(scroll) window.scrollTo({top:0,behavior:"auto"});
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-go]"); if(!a) return;
  e.preventDefault(); show(a.dataset.go); try{history.replaceState(null,"","#"+a.dataset.go)}catch(_){}
});
$("#menuBtn").onclick=()=>{const o=$("#links").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)};

/* rooms & gallery */
const ph=(src,label,alt)=>src?`<div class="ph"><img src="${src}" alt="${alt||label}" loading="lazy"></div>`:`<div class="ph empty"><div><img src="img/mark.png" alt="">${label}</div></div>`;
const photos=(list,labels,n,alt)=>Array.from({length:Math.max(n,list.length)},(_,i)=>ph(list[i],labels[i%labels.length],alt)).join("");
function renderBar(){$("#barGallery").innerHTML=photos(BAR_PHOTOS,t("barLabels"),6,"Giardino espresso & wine bar")}
function roomPics(r,name){
  const n=r.photos.length;
  return Array.from({length:3},(_,i)=>{
    const src=r.photos[i];
    if(!src) return ph(null,t("r.photo"));
    const more=(i===2&&n>3)?`<span class="more">+${n-3}</span>`:"";
    return `<button type="button" class="ph" data-lb="${r.id}" data-i="${i}" aria-label="${esc(name)}: ${t("lb.open")(n,i+1)}"><img src="${src}" alt="${esc(name)}" loading="lazy">${more}</button>`;
  }).join("");
}
function renderRooms(){
  $("#roomList").innerHTML=ROOMS.map(r=>{const x=R(r);return `<article class="room"><div class="pic">${roomPics(r,x.name)}</div><div class="body"><h3>${x.name}</h3><p class="desc">${x.desc}</p><ul>${x.tags.map(g=>`<li>${g}</li>`).join("")}</ul><div class="meta"><span>${t("r.upTo")(r.cap)} · ${x.size}</span><button type="button" data-book="${r.id}">${t("r.book")}</button></div></div></article>`}).join("");
  const sel=$("#room"),v=sel.value;
  sel.innerHTML=ROOMS.map(r=>`<option value="${r.id}">${R(r).name} (${t("r.opt")(r.cap)})</option>`).join("");
  if(v) sel.value=v;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-book]");if(!b)return;$("#room").value=b.dataset.book;show("availability")});

/* lightbox: all photos of the clicked room, arrows / keys / swipe */
const LB={list:[],i:0,name:"",from:null};
function lbShow(i){
  const n=LB.list.length; LB.i=(i+n)%n;
  $("#lbImg").src=LB.list[LB.i]; $("#lbImg").alt=`${LB.name} – ${LB.i+1}/${n}`;
  $("#lbCount").textContent=`${LB.i+1} / ${n}`;
  $("#lbThumbs").querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-current",k===LB.i));
  const cur=$("#lbThumbs").children[LB.i]; if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
  [1,-1].forEach(d=>{const im=new Image();im.src=LB.list[(LB.i+d+n)%n]});
}
function lbOpen(id,i){
  const r=ROOMS.find(x=>x.id===id); if(!r||!r.photos.length) return;
  LB.list=r.photos; LB.name=R(r).name; LB.from=document.activeElement;
  $("#lbTitle").textContent=LB.name;
  $("#lbThumbs").innerHTML=LB.list.map((s,k)=>`<button type="button" data-k="${k}" aria-label="${t("lb.open")(LB.list.length,k+1)}"><img src="${s}" alt="" loading="lazy"></button>`).join("");
  $("#lb").classList.toggle("single",LB.list.length<2);
  $("#lb").hidden=false; document.body.classList.add("lb-open");
  lbShow(i); $("#lbClose").focus();
}
function lbClose(){$("#lb").hidden=true;document.body.classList.remove("lb-open");if(LB.from)LB.from.focus()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lb]");if(b)lbOpen(b.dataset.lb,+b.dataset.i)});
$("#lbPrev").onclick=()=>lbShow(LB.i-1);
$("#lbNext").onclick=()=>lbShow(LB.i+1);
$("#lbClose").onclick=lbClose;
$("#lbThumbs").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)lbShow(+b.dataset.k)});
$("#lb").addEventListener("click",e=>{if(e.target.id==="lbStage"||e.target.id==="lb")lbClose()});
document.addEventListener("keydown",e=>{
  if($("#lb").hidden) return;
  if(e.key==="ArrowLeft")lbShow(LB.i-1);
  else if(e.key==="ArrowRight")lbShow(LB.i+1);
  else if(e.key==="Escape")lbClose();
  else if(e.key==="Tab"){const f=[...$("#lb").querySelectorAll("button")].filter(b=>b.offsetParent);const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
let sx=null;
$("#lbStage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("#lbStage").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>45)lbShow(LB.i+(dx<0?1:-1))});

/* availability flow */
const iso=d=>d.toISOString().slice(0,10);
const today=new Date();today.setHours(12);
const t1=new Date(today);t1.setDate(t1.getDate()+14);const t2=new Date(t1);t2.setDate(t2.getDate()+3);
$("#ci").min=iso(today);$("#co").min=iso(today);$("#ci").value=iso(t1);$("#co").value=iso(t2);
const fmt=s=>new Date(s+"T12:00").toLocaleDateString(lang==="en"?"en-GB":"el-GR",{weekday:"short",day:"numeric",month:"long",year:"numeric"});
const etaText=()=>{const o=$("#eta").selectedOptions[0];return o?o.textContent:""};
let booking={};
function setStep(n){["st1","st2","st3"].forEach((id,i)=>{const el=$("#"+id);el.className="step"+(i+1===n?" on":i+1<n?" done":"")})}
function renderAvail(){
  const {ci,co,n,g,r}=booking;
  $("#availBox").innerHTML=`<span class="eyebrow">${t("a.yes")}</span><b>${R(r).name}</b><span>${fmt(ci)} → ${fmt(co)} · ${n} ${t("a.nights")(n)} · ${g} ${t("a.guests")(g)}</span>`;
}
function renderDone(){
  const b=booking;
  $("#dSum").innerHTML=[[t("s.room"),R(b.r).name],[t("s.ci"),fmt(b.ci)+" · "+etaText()],[t("s.co"),fmt(b.co)],[t("s.nights"),b.n],[t("s.guests"),b.g],["Email",b.em],[t("s.phone"),b.ph]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
}
$("#f1").addEventListener("submit",e=>{
  e.preventDefault();const ci=$("#ci").value,co=$("#co").value,g=+$("#guests").value,r=ROOMS.find(x=>x.id===$("#room").value);
  $("#e1").textContent="";
  if(!ci||!co) return $("#e1").textContent=t("e.dates");
  if(ci<iso(today)) return $("#e1").textContent=t("e.past");
  const n=Math.round((new Date(co)-new Date(ci))/864e5);
  if(n<1) return $("#e1").textContent=t("e.min");
  if(g>r.cap) return $("#e1").textContent=t("e.cap")(R(r).name,r.cap);
  booking={ci,co,n,g,r};
  renderAvail();
  $("#f1").hidden=true;$("#avail").hidden=false;setStep(2);$("#fn").focus();
});
$("#back").onclick=()=>{$("#avail").hidden=true;$("#f1").hidden=false;setStep(1)};
$("#f2").addEventListener("submit",e=>{
  e.preventDefault();$("#e2").textContent="";
  const fn=$("#fn").value.trim(),ln=$("#ln").value.trim(),em=$("#em").value.trim(),ph=$("#ph").value.trim();
  if(!fn||!ln) return $("#e2").textContent=t("e.name");
  if(!/^\S+@\S+\.\S+$/.test(em)) return $("#e2").textContent=t("e.email");
  if(ph.replace(/\D/g,"").length<10) return $("#e2").textContent=t("e.phone");
  if(!$("#ok").checked) return $("#e2").textContent=t("e.ok");
  const ref="GD-"+Date.now().toString(36).toUpperCase().slice(-6);
  Object.assign(booking,{em,ph,lang});
  $("#dName").textContent=fn;$("#dRef").textContent=ref;
  renderDone();
  $("#avail").hidden=true;$("#done").hidden=false;setStep(3);
});
$("#again").onclick=()=>{$("#f2").reset();$("#ctry").value=t("f.ctryDefault");$("#done").hidden=true;$("#f1").hidden=false;setStep(1)};

/* event enquiry */
$("#fe").addEventListener("submit",e=>{
  e.preventDefault();const c=$("#evContact").value.trim();
  $("#eE").classList.remove("ok");
  if(!c){$("#eE").textContent=t("eq.empty");return}
  const type=$("#evType").selectedOptions[0].textContent;
  $("#eE").classList.add("ok");$("#eE").textContent=t("eq.ok")(type,c);
});

/* footer */
$("#yr").textContent=new Date().getFullYear();
document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
  const el=$("#"+b.dataset.copy),txt=el.textContent;
  const ok=()=>{b.textContent=t("ft.copied");setTimeout(()=>b.textContent=t("ft.copy"),1600)};
  try{navigator.clipboard.writeText(txt).then(ok,()=>sel(el))}catch(_){sel(el)}
}));
function sel(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

/* start */
setLang(lang);
show((location.hash||"#home").slice(1),false);
</script>
</body>
</html>
